<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Galeri · yaparmi.com</title>
  <meta name="description" content="Berkay galerisi." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#eceefa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0c1b" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/ikon-192.png" />
  <script>try{var t=localStorage.getItem("yaparmi_tema"),r=localStorage.getItem("yaparmi_renk");if(t)document.documentElement.dataset.theme=t;if(r)document.documentElement.dataset.renk=r}catch(e){}</script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/images/ikon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page gl-page">
    <header class="page-head gl-head">
      <span class="eyebrow"><i>🖼️</i> Galeri</span>
      <h1>En iyi <em>kareler</em></h1>
      <p class="lead" id="glLead">Grubun arşivi. Dokun, büyüt, kaydırarak gez.</p>
    </header>

    <!-- Vitrin: en son eklenen kare -->
    <section class="gl-vitrin" id="glVitrin" hidden>
      <div class="gl-vitrin-arka" id="glVitrinArka"></div>
      <button type="button" class="gl-vitrin-foto" id="glVitrinFoto" aria-label="Son eklenen fotoğrafı büyüt"><img alt="Son eklenen" id="glVitrinImg" /></button>
      <div class="gl-vitrin-yazi">
        <span class="gl-rozet">✨ Son eklenen</span>
        <b id="glVitrinKim"></b>
        <span id="glVitrinTarih"></span>
        <span class="gl-sayi" id="glSayi"></span>
      </div>
    </section>

    <div class="gl-izgara" id="glIzgara"><p class="gl-bos">Yükleniyor…</p></div>

    <!-- Fotoğraf ekle / öner -->
    <section class="card gl-yukle" id="glYukle">
      <div class="gl-yukle-ust">
        <h2 id="glYukleBaslik">📤 Fotoğraf öner</h2>
        <p class="muted" id="glYukleYazi">Kayıt olmana gerek yok. Tek seferde en fazla 20 fotoğraf. Admin onaylarsa galeriye eklenir.</p>
      </div>
      <form id="suggestForm" autocomplete="off" class="gl-form">
        <label class="gl-dosya">
          <input type="file" id="suggestFile" accept="image/*" multiple required />
          <span>🖼️ Fotoğraf seç</span>
        </label>
        <button type="submit" class="btn" id="glGonder">Gönder</button>
      </form>
      <div class="suggest-onizleme" id="suggestOnizleme" hidden></div>
      <p class="suggest-status" id="suggestStatus"></p>
    </section>
  </main>

  <!-- Tam ekran görüntüleyici -->
  <div class="gl-lb" id="glLb" hidden role="dialog" aria-modal="true" aria-label="Fotoğraf">
    <div class="gl-lb-arka" id="glLbArka"></div>
    <div class="gl-lb-ust">
      <span id="glLbSayac"></span>
      <div class="gl-lb-araclar">
        <button type="button" id="glLbPaylas" aria-label="Paylaş">📤</button>
        <button type="button" id="glLbIndir" aria-label="İndir">⬇️</button>
        <button type="button" id="glLbKapat" aria-label="Kapat">✕</button>
      </div>
    </div>
    <button type="button" class="gl-lb-ok sol" id="glLbOnceki" aria-label="Önceki">‹</button>
    <div class="gl-lb-sahne" id="glLbSahne"><img id="glLbImg" alt="" /></div>
    <button type="button" class="gl-lb-ok sag" id="glLbSonraki" aria-label="Sonraki">›</button>
    <div class="gl-lb-alt" id="glLbAlt"></div>
  </div>
  <a class="gl-fab" href="#glYukle" id="glFab" aria-label="Fotoğraf ekle">＋</a>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/site.js"></script>
  <script src="js/ekonomi.js"></script>
  <script src="js/basarim.js"></script>
  <script src="js/bildirim.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
