<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yaparmi.com — Berkay Yapar mı?</title>
  <meta name="description" content="Berkay bunu yapar mı, yapamaz mı? Sor, öğren." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="wrap">
    <header class="site-header">
      <div class="logo">🔮 yaparmi<span class="dot">.</span>com</div>
      <p class="subtitle">Berkay ile ilgili merak ettiğin her şeyi sor.</p>
    </header>

    <section class="card">
      <form id="ask-form" autocomplete="off">
        <label for="question" class="visually-hidden">Sorunu yaz</label>
        <input
          id="question"
          name="question"
          type="text"
          placeholder="ör: Berkay ders çalışır mı?"
          maxlength="140"
          required
        />
        <button type="submit" id="ask-btn">
          <span class="btn-text">Sor</span>
          <span class="btn-loading" hidden>...</span>
        </button>
      </form>

      <div class="answer-box" id="answer-box" aria-live="polite">
        <span class="answer-placeholder" id="answer-placeholder">Cevap burada görünecek 👀</span>
        <span class="answer-text" id="answer-text"></span>
        <span class="cursor" id="cursor" hidden></span>
      </div>

      <p class="hint">Ne sorarsan sor, kâhin dürüst cevap verir. (Genelde kötü haber olur.)</p>
    </section>

    <footer class="site-footer">
      <p>yaparmi.com — sadece eğlence amaçlıdır 😄</p>
    </footer>
  </main>

  <!-- Arka plan sesleri: audio/track1.mp3 ve audio/track2.mp3 sırayla çalar -->
  <audio id="track1" src="audio/track1.mp3" preload="auto"></audio>
  <audio id="track2" src="audio/track2.mp3" preload="auto"></audio>

  <button id="sound-toggle" class="sound-toggle" aria-pressed="false" title="Sesi aç/kapat">
    <span id="sound-icon">🔊</span>
  </button>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
