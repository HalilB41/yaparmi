<body>
  <main class="page page-narrow">
    <header class="page-head">

        <div class="story-stage" id="storyStage">
          <div class="story-avatar" id="storyAvatar">
            <img id="storyImg" alt="Berkay" hidden />
            <span class="story-avatar-fallback" id="storyFallback">🧍</span>
            <span class="story-emoji" id="storyEmoji"></span>
          </div>
          <p class="story-text" id="storyText">Yükleniyor...</p>
          <div class="story-choices" id="storyChoices"></div>
          <div class="story-footer">
            <button type="button" class="link-btn" id="storyBack" hidden>◀ Geri</button>
            <span class="story-step muted" id="storyStep"></span>
            <button type="button" class="link-btn" id="storyRestart" hidden>🔁 Baştan başla</button>
          </div>
        </div>
    </div>
  </main>
