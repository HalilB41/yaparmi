<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sosyal Hayat — yaparmi.com</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👥</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="app-shell">
    <header class="topbar">
      <button type="button" class="hamburger-btn" id="menuBtn" aria-label="Menü" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a href="/" class="logo-link" aria-label="Ana sayfaya dön">
        <div class="logo">🔮 yaparmi<span class="dot">.</span>com</div>
      </a>
      <div class="auth-widget" id="authWidget">
        <button type="button" class="auth-toggle" id="authToggle">Giriş Yap</button>
        <div class="card auth-panel" id="authPanel" hidden></div>
      </div>
    </header>

    <nav class="menu-drawer" id="menuDrawer" hidden>
      <a href="/spor" class="menu-item"><span class="fab-icon">⚽</span> Spor</a>
      <a href="/ders" class="menu-item"><span class="fab-icon">📚</span> Ders</a>
      <a href="/oyun" class="menu-item"><span class="fab-icon">🎮</span> Oyun</a>
      <a href="/sosyal" class="menu-item"><span class="fab-icon">👥</span> Sosyal Hayat</a>
      <a href="/galeri" class="menu-item"><span class="fab-icon">🖼️</span> Galeri</a>
    </nav>
    <div class="menu-overlay" id="menuOverlay" hidden></div>

    <section class="center-panel">
      <div class="panel card placeholder-card">
        <h2>👥 Sosyal Hayat</h2>
        <p class="muted">Çok yakında burada olacak...</p>
        <p><a href="/" class="link-btn">◀ Ana sayfaya dön</a></p>
      </div>
    </section>

    <footer class="site-footer">
      <p>yaparmi.com — sadece eğlence amaçlıdır 😄</p>
    </footer>
  </main>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
