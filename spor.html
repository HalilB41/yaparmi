<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spor · yaparmi.com</title>
  <meta name="description" content="Berkay'ın spor kariyeri." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#06070d" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/ikon-192.png" />
  <script>try{var t=localStorage.getItem("yaparmi_tema"),r=localStorage.getItem("yaparmi_renk");document.documentElement.dataset.theme=t==="light"?"light":"dark";if(r)document.documentElement.dataset.renk=r}catch(e){}</script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/images/ikon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page page-narrow">
    <header class="page-head">
      <span class="eyebrow"><i>⚽</i> Spor</span>
      <h1>Berkay'ın <em>spor kariyeri</em></h1>
      <p class="lead">Dene, gör, ağla. Boks makinesinden penaltıya, kasksız 85'ten haftanın rezilliği oylamasına.</p>
    </header>
    <div class="panel card game-panel">
        <div class="game-picker" id="sporPicker">
          <button type="button" class="game-tab active" data-spor="boks">🥊 Boks Makinesi</button>
          <button type="button" class="game-tab" data-spor="penalti">⚽ Penaltı</button>
          <button type="button" class="game-tab" data-spor="motor">🏍️ Kasksız 85</button>
          <button type="button" class="game-tab" data-spor="karne">📋 Spor Karnesi</button>
          <button type="button" class="game-tab" data-spor="olimpiyat">🏆 Berkay Olimpiyatı</button>
        </div>
      <div id="sporContainer"></div>
    </div>
  </main>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/site.js"></script>
  <script src="js/ekonomi.js"></script>
  <script src="js/basarim.js"></script>
  <script src="js/bildirim.js"></script>
  <script src="js/rekor.js"></script>
  <script src="js/spor.js"></script>
</body>
</html>
