<!DOCTYPE html>

<head>

  <meta name="theme-color" content="#06070d" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/ikon-192.png" />
  <script>try{var t=localStorage.getItem("yaparmi_tema"),r=localStorage.getItem("yaparmi_renk");document.documentElement.dataset.theme=t==="light"?"light":"dark";if(r)document.documentElement.dataset.renk=r}catch(e){}</script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/images/ikon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="wr-body">
  <main class="page ek-page wr-page">
    <div class="card cark-kapi" id="ekKapi">
      <div class="cark-kapi-ico">🎁</div>
      <p id="ekKapiYazi">Yükleniyor…</p>
      <button type="button" class="btn" id="ekGirisBtn" hidden>Kayıt ol / giriş yap</button>
    </div>
    <div id="ekIcerik" hidden>
      <div class="wr-sahne" id="wrSahne" aria-live="polite">
        <div class="wr-ilerleme" id="wrIlerleme"></div>
        <button type="button" class="wr-kapat" id="wrKapat" aria-label="Kapat">✕</button>
        <div class="wr-kart" id="wrKart"></div>
        <button type="button" class="wr-geri" id="wrGeri" aria-label="Önceki"></button>
        <button type="button" class="wr-ileri" id="wrIleri" aria-label="Sonraki"></button>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
