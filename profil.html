<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Profil · yaparmi.com</title>
  <meta name="description" content="yaparmi.com profili: BERKAY bakiyesi, sıralama, rekorlar, borsa geçmişi." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#06070d" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/ikon-192.png" />
  <script>try{var t=localStorage.getItem("yaparmi_tema"),r=localStorage.getItem("yaparmi_renk");document.documentElement.dataset.theme=t==="light"?"light":"dark";if(r)document.documentElement.dataset.renk=r}catch(e){}</script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/images/ikon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page ek-page">
    <div class="card cark-kapi" id="ekKapi">
      <div class="cark-kapi-ico">🔐</div>
      <p id="ekKapiYazi">Yükleniyor…</p>
      <button type="button" class="btn" id="ekGirisBtn" hidden>Kayıt ol / giriş yap</button>
    </div>
    <div id="ekIcerik" hidden>
      <section class="card pf-ust" id="pfUst"><p class="muted">Yükleniyor…</p></section>
      <div class="pf-grid">
        <section class="card pf-kutu"><h2>🪙 Cüzdan</h2><div id="pfCuzdan" class="bx-ozet"></div></section>
        <section class="card pf-kutu"><h2>🏆 Oyun rekorları</h2><div id="pfRekor" class="bx-liste"></div></section>
        <section class="card pf-kutu"><h2>⚡ Borsa karnesi</h2><div id="pfBorsa" class="bx-liste"></div></section>
        <section class="card pf-kutu"><h2>🎲 Tahminler</h2><div id="pfTahmin" class="bx-liste"></div></section>
      </div>
      <section class="card pf-kutu"><h2>🐳 Zenginler listesi</h2><div id="pfZengin" class="bx-liste"></div></section>
    </div>
    <section class="card pf-kutu pf-basarim" id="basarim">
      <div class="pf-bs-ust"><h2>🏆 Başarımlarım</h2><small class="muted">Oyunlarda, sporda, sohbette ve kâhinde açılan rozetler. Bu cihazda tutulur.</small></div>
      <div class="bs-ozet" id="bsOzet"></div>
      <div id="bsSayfa"></div>
      <p class="bs-alt"><button type="button" class="link-btn" id="bsSifirla">Başarımları sıfırla</button> <span class="muted" id="bsSifirlaOnay" hidden>Emin misin? <button type="button" class="link-btn" id="bsSifirlaEvet">Evet, sıfırla</button> · <button type="button" class="link-btn" id="bsSifirlaHayir">Vazgeç</button></span></p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/site.js"></script>
  <script src="js/ekonomi.js"></script>
  <script src="js/basarim.js"></script>
  <script src="js/bildirim.js"></script>
  <script src="js/borsa-grafik.js"></script>
  <script src="js/oyuncu.js"></script>
  <script src="js/profil.js"></script>
  <script src="js/basarimlar.js"></script>
</body>
</html>
